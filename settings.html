<div class="ym-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Yahoo Messenger Theme</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="ym_enabled">
                <input id="ym_enabled" type="checkbox" />
                <span>Enable theme</span>
            </label>

            <div class="ym-setting-row">
                <label for="ym_look">Look</label>
                <select id="ym_look" class="text_pole">
                    <option value="retro">Retro (Messenger on Windows XP)</option>
                    <option value="modern">Modern</option>
                </select>
            </div>

            <label class="checkbox_label" for="ym_xp_desktop">
                <input id="ym_xp_desktop" type="checkbox" />
                <span>Retro look: XP-style wallpaper and taskbar (off shows your own background)</span>
            </label>

            <label class="checkbox_label" for="ym_xp_logon">
                <input id="ym_xp_logon" type="checkbox" />
                <span>Start each session with the Windows logon and Messenger sign-in</span>
            </label>

            <div class="ym-setting-row">
                <label for="ym_screensaver">Pipes screensaver after (minutes, 0 is never)</label>
                <input id="ym_screensaver" class="text_pole" type="number" min="0" max="240" step="1" />
            </div>

            <div class="ym-setting-row">
                <label for="ym_appearance">Appearance (modern look)</label>
                <select id="ym_appearance" class="text_pole">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="system">Follow the system</option>
                </select>
            </div>

            <div class="ym-setting-row">
                <label for="ym_message_style">Messages</label>
                <select id="ym_message_style" class="text_pole">
                    <option value="transcript">Transcript (name, then text)</option>
                    <option value="bubbles">Bubbles</option>
                </select>
            </div>

            <div class="ym-setting-row">
                <label for="ym_list_lines">Under a contact's name</label>
                <select id="ym_list_lines" class="text_pole">
                    <option value="message">Last message</option>
                    <option value="about">About the character</option>
                    <option value="none">Nothing</option>
                </select>
            </div>

            <label class="checkbox_label" for="ym_display_images">
                <input id="ym_display_images" type="checkbox" />
                <span>Show display images beside the conversation</span>
            </label>

            <label class="checkbox_label" for="ym_tabs">
                <input id="ym_tabs" type="checkbox" />
                <span>Show conversation tabs</span>
            </label>

            <label class="checkbox_label" for="ym_presence">
                <input id="ym_presence" type="checkbox" />
                <span>Show status faces on contacts</span>
            </label>

            <label class="checkbox_label" for="ym_short_times">
                <input id="ym_short_times" type="checkbox" />
                <span>Short message times</span>
            </label>

            <label class="checkbox_label" for="ym_sounds">
                <input id="ym_sounds" type="checkbox" />
                <span>Play sounds for new messages and Buzz</span>
            </label>

            <label class="checkbox_label" for="ym_use_background">
                <input id="ym_use_background" type="checkbox" />
                <span>Use my SillyTavern background behind the windows</span>
            </label>

            <label class="checkbox_label" for="ym_pause_user_theme">
                <input id="ym_pause_user_theme" type="checkbox" />
                <span>Pause my Custom CSS and UI theme while this theme is on</span>
            </label>

            <div class="ym-setting-row">
                <div id="ym_customize" class="menu_button menu_button_icon">
                    <i class="fa-solid fa-palette"></i>
                    <span>Customize theme…</span>
                </div>
            </div>

            <div id="ym_extension_switch"></div>

            <small class="ym-note">Turning this theme on turns off other theme extensions (they come back if you turn them on again). An unofficial fan theme, not made by or connected with Yahoo.</small>
        </div>
    </div>
</div>
